<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Teko:wght@500;700&display=swap">
<style>
/* Ein Bildschirm: Canvas 1280x720 im Querformat, per Seitenverhältnis eingepasst */
:root { --bg: #07060a; --fg: #f4efe4; --ember: #ff6a1a; --web: #e8eef7; color-scheme: dark; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }

#rot { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(7, 6, 10, 0.94); color: var(--fg);

</style>
<div id="wrap"><canvas id="c" aria-label="Spider-Man gegen Scorpion – Kampfspiel"></canvas></div>
<div id="rot" hidden><div><b>HANDY DREHEN</b>Das Spiel läuft im Querformat.</div></div>
<script>
'use strict';
// =====================================================================
//  SPIDER-MAN vs. SCORPION – inoffizielles, privates Fan-Kampfspiel
//  2D-Canvas-Engine: feste 60-Hz-Simulation, AABB-Treffer, Multitouch
// =====================================================================
const W = 1280, H = 720, FLOOR = 610, STAGE = 2200, STEP = 1000 / 60;
const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });
const rotEl = document.getElementById('rot');
let scale = 1, frameNo = 0, timeScale = 1;
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const aabb = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const s = Math.min(vw / W, vh / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = Math.round(W * s) + 'px'; cv.style.height = Math.round(H * s) + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  scale = cv.width / W;
  rotEl.hidden = vw >= vh;
  buildBackground();
}
window.addEventListener('resize', resize);

// ---------------------------------------------------------------- Audio (synthetisch)
const Sfx = {
  ctx: null, noise: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const b = this.ctx.createBuffer(1, this.ctx.sampleRate, this.ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.noise = b;
    } catch (e) { this.ctx = null; }
  },
  tone(f0, f1, dur, type, vol) {
    const c = this.ctx; if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  },
  hiss(dur, f, q, vol, sweep) {
    const c = this.ctx; if (!c) return;
    const s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime;
    s.buffer = this.noise; fl.type = 'bandpass'; fl.frequency.setValueAtTime(f, t); fl.Q.value = q;
    if (sweep) fl.frequency.exponentialRampToValueAtTime(sweep, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(fl).connect(g).connect(c.destination); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },
  play(k) {
    if (!this.ctx) return;
    if (k === 'hit') { this.hiss(0.12, 1800, 0.8, 0.5); this.tone(160, 60, 0.14, 'sine', 0.6); }
    else if (k === 'heavy') { this.hiss(0.2, 900, 0.7, 0.7); this.tone(110, 38, 0.3, 'sine', 0.9); }
    else if (k === 'block') { this.hiss(0.06, 3200, 3, 0.35); this.tone(900, 500, 0.06, 'square', 0.08); }
    else if (k === 'whoosh') this.hiss(0.16, 600, 1.2, 0.18, 2400);
    else if (k === 'web') { this.hiss(0.14, 5200, 2, 0.4, 1800); this.tone(1400, 500, 0.12, 'triangle', 0.12); }
    else if (k === 'chain') { for (let i = 0; i < 4; i++) setTimeout(() => this.hiss(0.05, 4200 + i * 300, 6, 0.28), i * 35); this.tone(700, 1500, 0.2, 'sawtooth', 0.05); }
    else if (k === 'ko') { this.tone(90, 30, 1.2, 'sine', 1); this.hiss(0.8, 300, 0.5, 0.5); }
    else if (k === 'bell') { this.tone(660, 640, 0.9, 'triangle', 0.25); this.tone(990, 980, 0.6, 'sine', 0.12); }
  },
  say(text) {
    try { if (!window.speechSynthesis) return; const u = new SpeechSynthesisUtterance(text); u.lang = 'de-DE'; u.rate = 1.05; u.pitch = 0.7; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) { }
  },
};

// ---------------------------------------------------------------- Kämpfer-Daten
// Frame-Daten bei 60 FPS: st = Startup, ac = Active, rc = Recovery. hb = Trefferzone um Faust/Fuß.
const CHARS = {
  spider: {
    name: 'SPIDER-MAN', scale: 1, speed: 6.4, jump: -20.5, hp: 1000, doubleJump: true, dodge: true,
    moves: {
      LP: { st: 4, ac: 3, rc: 7, dmg: 34, stun: 15, push: 2.5, hit: 'hand', size: 54, pose: 'jab' },
      HP: { st: 8, ac: 4, rc: 13, dmg: 62, stun: 20, push: 6, hit: 'hand2', size: 60, pose: 'cross', heavy: true },
      K: { st: 7, ac: 4, rc: 12, dmg: 56, stun: 18, push: 5, hit: 'foot', size: 60, pose: 'kick' },
      AIR: { st: 3, ac: 8, rc: 4, dmg: 44, stun: 18, push: 4, hit: 'foot', size: 64, pose: 'airKick' },
      SPEC: { st: 9, ac: 1, rc: 18, cd: 75, proj: 'web', pose: 'shoot' },
    },
  },
  scorpion: {
    name: 'SCORPION', scale: 1.06, speed: 5.0, jump: -18.5, hp: 1080, doubleJump: false, dodge: false,
    moves: {
      LP: { st: 6, ac: 3, rc: 10, dmg: 46, stun: 16, push: 3.5, hit: 'hand', size: 56, pose: 'jab' },
      HP: { st: 11, ac: 5, rc: 18, dmg: 92, stun: 24, push: 9, hit: 'hand2', size: 66, pose: 'cross', heavy: true, kd: true },
      K: { st: 9, ac: 4, rc: 15, dmg: 74, stun: 20, push: 7, hit: 'foot', size: 64, pose: 'kick', heavy: true },
      AIR: { st: 4, ac: 8, rc: 5, dmg: 58, stun: 20, push: 5, hit: 'foot', size: 66, pose: 'airKick' },
      SPEC: { st: 12, ac: 1, rc: 22, cd: 95, proj: 'spear', pose: 'throw' },
    },
  },
};
// Skelett-Längen (Pixel bei Maßstab 1)
const BONE = { torso: 92, neck: 12, head: 27, upper: 50, fore: 48, thigh: 62, shin: 60, hipY: 128 };

// ---------------------------------------------------------------- Posen (Grad)
// l = Oberkörperneigung, aF/eF = vorderer Arm (Schulter/Ellbogen), aB/eB = hinterer Arm,
// hF/kF = vorderes Bein (Hüfte/Knie), hB/kB = hinteres Bein, y = Hüfte absenken (px), r = Körperdrehung
const POSES = {
  guard: { l: 6, aF: 26, eF: 128, aB: 44, eB: 112, hF: 20, kF: 26, hB: -16, kB: 18, y: 10, r: 0 },
  walkA: { l: 8, aF: 22, eF: 122, aB: 40, eB: 108, hF: 34, kF: 18, hB: -26, kB: 30, y: 6, r: 0 },
  walkB: { l: 8, aF: 30, eF: 132, aB: 48, eB: 116, hF: -10, kF: 36, hB: 12, kB: 8, y: 12, r: 0 },
  crouch: { l: 20, aF: 34, eF: 128, aB: 50, eB: 118, hF: 78, kF: 116, hB: 34, kB: 112, y: 62, r: 0 },
  jump: { l: 12, aF: 40, eF: 120, aB: 60, eB: 110, hF: 80, kF: 120, hB: 40, kB: 110, y: 0, r: 0 },
  jab: { l: 14, aF: 86, eF: 6, aB: 46, eB: 118, hF: 30, kF: 16, hB: -24, kB: 14, y: 14, r: 0 },
  cross: { l: 24, aF: 40, eF: 130, aB: 92, eB: 2, hF: 34, kF: 20, hB: -34, kB: 6, y: 18, r: 0 },
  kick: { l: -18, aF: 34, eF: 120, aB: 64, eB: 96, hF: 96, kF: 2, hB: -6, kB: 6, y: 0, r: 0 },
  airKick: { l: -10, aF: 60, eF: 90, aB: 80, eB: 80, hF: 70, kF: 0, hB: 30, kB: 110, y: 0, r: 0 },
  shoot: { l: 10, aF: 92, eF: 0, aB: 30, eB: 120, hF: 30, kF: 18, hB: -26, kB: 16, y: 16, r: 0 },
  throw: { l: 20, aF: 96, eF: 4, aB: -30, eB: 60, hF: 36, kF: 22, hB: -36, kB: 10, y: 20, r: 0 },
  pull: { l: -14, aF: 40, eF: 100, aB: -20, eB: 40, hF: 18, kF: 12, hB: -30, kB: 14, y: 12, r: 0 },
  hit: { l: -22, aF: -10, eF: 60, aB: 10, eB: 50, hF: 10, kF: 20, hB: -24, kB: 24, y: 14, r: 0 },
  block: { l: -2, aF: 46, eF: 150, aB: 50, eB: 152, hF: 18, kF: 30, hB: -20, kB: 24, y: 20, r: 0 },
  bound: { l: 0, aF: 4, eF: 6, aB: 6, eB: 8, hF: 4, kF: 2, hB: -4, kB: 2, y: 0, r: 0 },
  down: { l: 0, aF: 160, eF: 10, aB: 120, eB: 30, hF: 8, kF: 10, hB: -8, kB: 14, y: 106, r: -90 },
  victory: { l: -4, aF: 172, eF: 12, aB: 20, eB: 100, hF: 16, kF: 6, hB: -16, kB: 6, y: 0, r: 0 },
  dodge: { l: 20, aF: 70, eF: 90, aB: 80, eB: 90, hF: 90, kF: 120, hB: 70, kB: 120, y: 20, r: 0 },
};
const POSE_KEYS = Object.keys(POSES.guard);

// ---------------------------------------------------------------- Eingabe (Multitouch + Tastatur)
const Input = { x: 0, y: 0, jump: false, crouch: false, LP: 0, HP: 0, K: 0, SPEC: 0, dodge: 0, back: [] };
const BUTTONS = [
  { k: 'HP', label: 'HP', sub: 'SCHWER', x: 1036, y: 470, r: 58 },
  { k: 'SPEC', label: 'SPEC', sub: 'SPEZIAL', x: 1172, y: 430, r: 58 },
  { k: 'LP', label: 'LP', sub: 'LEICHT', x: 992, y: 610, r: 64 },
  { k: 'K', label: 'K', sub: 'TRITT', x: 1142, y: 580, r: 64 },
];
const touches = new Map(); // id -> { kind: 'stick'|'btn', ... }
const stick = { active: false, ox: 190, oy: 560, x: 190, y: 560, id: null, jumpArmed: true };
const BUF = 8; // Eingabepuffer in Frames
function toLocal(t) { const r = cv.getBoundingClientRect(); return { x: (t.clientX - r.left) / r.width * W, y: (t.clientY - r.top) / r.height * H }; }
function pressAt(p, id) {
  Sfx.init();
  if (Game.screen !== 'fight') { Game.tap(p); return; }
  if (p.y < 125 && Math.abs(p.x - W / 2) < 60) { Game.paused = !Game.paused; return; }
  for (const b of BUTTONS) if (Math.hypot(p.x - b.x, p.y - b.y) < b.r + 14) { touches.set(id, { kind: 'btn', b }); Input[b.k] = BUF; b.down = true; return; }
  if (p.x < W * 0.5 && !stick.active) { stick.active = true; stick.id = id; stick.ox = p.x; stick.oy = p.y; stick.x = p.x; stick.y = p.y; touches.set(id, { kind: 'stick' }); }
}
function moveAt(p, id) {
  const t = touches.get(id); if (!t || t.kind !== 'stick') return;
  const dx = p.x - stick.ox, dy = p.y - stick.oy, d = Math.hypot(dx, dy), m = 92;
  stick.x = stick.ox + (d > m ? dx / d * m : dx); stick.y = stick.oy + (d > m ? dy / d * m : dy);
}
function releaseAt(id) {
  const t = touches.get(id); if (!t) return;
  if (t.kind === 'btn') t.b.down = false;
  if (t.kind === 'stick') { stick.active = false; stick.id = null; stick.jumpArmed = true; }
  touches.delete(id);
}
cv.addEventListener('touchstart', (e) => { e.preventDefault(); for (const t of e.changedTouches) pressAt(toLocal(t), t.identifier); }, { passive: false });
cv.addEventListener('touchmove', (e) => { e.preventDefault(); for (const t of e.changedTouches) moveAt(toLocal(t), t.identifier); }, { passive: false });
const endTouch = (e) => { e.preventDefault(); for (const t of e.changedTouches) releaseAt(t.identifier); };
cv.addEventListener('touchend', endTouch, { passive: false });
cv.addEventListener('touchcancel', endTouch, { passive: false });
cv.addEventListener('mousedown', (e) => pressAt(toLocal(e), 'm'));
window.addEventListener('mousemove', (e) => { if (e.buttons) moveAt(toLocal(e), 'm'); });
window.addEventListener('mouseup', () => releaseAt('m'));
document.addEventListener('gesturestart', (e) => e.preventDefault());
const keys = new Set();
const KEYMAP = { KeyJ: 'LP', KeyK: 'HP', KeyL: 'K', KeyI: 'SPEC' };
window.addEventListener('keydown', (e) => {
  Sfx.init();
  if (KEYMAP[e.code] && !e.repeat) Input[KEYMAP[e.code]] = BUF;
  if ((e.code === 'Enter' || e.code === 'Space') && Game.screen !== 'fight') Game.tap({ x: W / 2, y: 470, key: true });
  if (e.code === 'KeyP' || e.code === 'Escape') Game.paused = !Game.paused;
  keys.add(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
function pollInput() {
  let x = 0, y = 0;
  if (stick.active) { x = (stick.x - stick.ox) / 92; y = (stick.y - stick.oy) / 92; }
  if (keys.has('KeyA') || keys.has('ArrowLeft')) x = -1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) x = 1;
  if (keys.has('KeyW') || keys.has('ArrowUp')) y = -1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) y = 1;
  Input.x = Math.abs(x) < 0.25 ? 0 : clamp(x, -1, 1);
  Input.crouch = y > 0.55;
  // Springen: Stick nach oben wischen (einmal pro Wisch)
  if (y < -0.6 && stick.jumpArmed) { Input.jump = BUF; stick.jumpArmed = false; }
  if (y > -0.3) stick.jumpArmed = true;
  if (Input.jump > 0) Input.jump--;
  for (const k of ['LP', 'HP', 'K', 'SPEC', 'dodge']) if (Input[k] > 0) Input[k]--;
}

// ---------------------------------------------------------------- Partikel & Bodenflecken
const parts = [], bgParts = [], decals = [];
function spark(x, y, dir, n, color, speed = 11) {
  for (let i = 0; i < n; i++) { const a = rand(-0.9, 0.9) + (dir < 0 ? Math.PI : 0); const v = rand(speed * 0.4, speed); parts.push({ t: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, life: rand(10, 20), max: 20, c: color, s: rand(2, 4) }); }
  parts.push({ t: 'flash', x, y, life: 6, max: 6, c: color, s: 60 });
}
function blood(x, y, dir, n) {
  for (let i = 0; i < n; i++) parts.push({ t: 'blood', x, y, vx: dir * rand(2, 9) + rand(-2, 2), vy: rand(-9, -2), life: 60, max: 60, s: rand(3, 7) });
}
function dust(x, y, n) { for (let i = 0; i < n; i++) parts.push({ t: 'dust', x: x + rand(-30, 30), y, vx: rand(-2, 2), vy: rand(-2.5, -0.5), life: rand(18, 30), max: 30, s: rand(10, 22) }); }
function updateParts() {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life--;
    if (p.t === 'spark') { p.x += p.vx; p.y += p.vy; p.vy += 0.5; p.vx *= 0.92; }
    else if (p.t === 'blood') { p.x += p.vx; p.y += p.vy; p.vy += 0.55; if (p.y >= FLOOR) { if (decals.length > 70) decals.shift(); decals.push({ x: p.x, w: p.s * rand(2, 4), h: p.s * rand(0.5, 0.9), a: rand(0.5, 0.85) }); p.life = 0; } }
    else if (p.t === 'dust') { p.x += p.vx; p.y += p.vy; p.vx *= 0.94; }
    if (p.life <= 0) parts.splice(i, 1);
  }
}
// Hintergrund-Partikel (Glut aus der Lava, Rauch) laufen mit 30 FPS
function updateBgParts() {
  if (bgParts.length < 90) bgParts.push(Math.random() < 0.7
    ? { t: 'ember', x: rand(0, STAGE), y: FLOOR + rand(10, 100), vx: rand(-0.6, 0.6), vy: rand(-2.6, -1), life: rand(80, 200), max: 200, s: rand(1.5, 3.5) }
    : { t: 'smoke', x: rand(0, STAGE), y: FLOOR + 40, vx: rand(-0.4, 0.4), vy: rand(-1.1, -0.5), life: rand(120, 220), max: 220, s: rand(30, 70) });
  for (let i = bgParts.length - 1; i >= 0; i--) {
    const p = bgParts[i]; p.x += p.vx * 2; p.y += p.vy * 2; p.vx += rand(-0.08, 0.08); p.life -= 2;
    if (p.t === 'smoke') p.s += 0.6;
    if (p.life <= 0) bgParts.splice(i, 1);
  }
}

// ---------------------------------------------------------------- Projektile
const projs = [];
function spawnProj(f) {
  const k = f.def.moves.SPEC.proj, hand = f.joints.handF;
  if (k === 'web') { projs.push({ k, owner: f, x: hand.x, y: hand.y, vx: f.facing * 27, life: 60, w: 46, h: 30 }); Sfx.play('web'); }
  else { projs.push({ k, owner: f, x: hand.x, y: hand.y, vx: f.facing * 25, life: 42, w: 50, h: 22, back: false }); Sfx.play('chain'); }
}
function updateProjs() {
  for (let i = projs.length - 1; i >= 0; i--) {
    const p = projs[i], f = p.owner, o = Game.other(f);
    if (p.k === 'spear' && p.back) { // Kette einholen
      const h = f.joints.handF; p.x = lerp(p.x, h.x, 0.35); p.y = lerp(p.y, h.y, 0.35);
      if (Math.abs(p.x - h.x) < 30 || f.state !== 'special') projs.splice(i, 1);
      continue;
    }
    p.x += p.vx; p.life--;
    const box = { x: p.x - p.w / 2, y: p.y - p.h / 2, w: p.w, h: p.h };
    if (!o.invuln() && aabb(box, o.hurtbox())) {
      if (o.blocking(f)) { o.blockHit(f, 3); spark(p.x, p.y, -f.facing, 8, '#9fd8ff'); Sfx.play('block'); }
      else if (p.k === 'web') { o.bind(f); spark(p.x, p.y, f.facing, 10, '#ffffff', 8); }
      else { o.pullTo(f); blood(p.x, p.y, f.facing, 10); Sfx.play('heavy'); Sfx.say('Komm her!'); Game.popText('KOMM HER!', f, '#ffcf3a'); }
      if (p.k === 'spear') { p.hooked = o; p.back = true; p.vx = 0; continue; }
      projs.splice(i, 1); continue;
    }
    if (p.life <= 0 || p.x < Game.cam - 100 || p.x > Game.cam + W + 100) {
      if (p.k === 'spear') { p.back = true; continue; }
      projs.splice(i, 1);
    }
  }
}

// ---------------------------------------------------------------- Kämpfer
class Fighter {
  constructor(id, side, isCPU) {
    this.id = id; this.def = CHARS[id]; this.side = side; this.cpu = isCPU;
    this.ai = { t: 0, x: 0, block: 0, want: null };
    this.wins = 0; this.reset();
  }
  reset() {
    this.x = STAGE / 2 + (this.side === 0 ? -260 : 260); this.y = FLOOR; this.vx = 0; this.vy = 0;
    this.facing = this.side === 0 ? 1 : -1; this.state = 'idle'; this.t = 0; this.move = null; this.mv = null;
    this.hp = this.def.hp; this.hpShow = this.hp; this.hpTrail = this.hp; this.trailDelay = 0; this.flash = 0;
    this.stun = 0; this.combo = 0; this.hitDone = false; this.cd = 0; this.airJumps = 1; this.inv = 0; this.hitstop = 0;
    this.pose = Object.assign({}, POSES.guard); this.walkPhase = 0; this.backTaps = []; this.lastX = 0;
    this.joints = {}; this.solve();
  }
  get grounded() { return this.y >= FLOOR - 0.5; }
  invuln() { return this.inv > 0 || this.state === 'down' || this.state === 'ko'; }
  canAct() { return ['idle', 'walk', 'crouch'].includes(this.state); }
  holdBack() { return this.cpu ? this.ai.block > 0 : Input.x * this.facing < -0.4; }
  blocking(att) { return (this.canAct() || this.state === 'blockstun') && this.grounded && this.holdBack() && !(att && att.state === 'jump'); }
  hurtbox() {
    const s = this.def.scale, crouch = this.state === 'crouch' || (this.state === 'blockstun' && this.pose.y > 40);
    const h = (crouch ? 190 : 290) * s, w = 92 * s;
    if (this.state === 'down') return { x: this.x - 120, y: this.y - 50, w: 240, h: 50 };
    return { x: this.x - w / 2, y: this.y - h, w, h };
  }
  set(state, t = 0) { this.state = state; this.t = t; }
  // --- Treffer empfangen

  for (const c of Game.combos) {
    if (c.n < 2) continue;
    const big = c.n >= 3, age = c.age, pop = 1 + Math.max(0, 0.6 - age * 0.06) * (big ? 1 : 0.4);
    const sz = (big ? 70 : 46) * pop, x = c.side ? W - 250 : 250, y = 210;
    ctx.save(); ctx.translate(x, y); ctx.rotate(c.side ? 0.06 : -0.06);
    ctx.font = sz.toFixed(0) + 'px Bangers, Impact, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 8; ctx.strokeStyle = '#120a08'; ctx.strokeText(c.n + '-HIT COMBO', 0, 0);
    const g = ctx.createLinearGradient(0, -sz / 2, 0, sz / 2); g.addColorStop(0, '#fff3b0'); g.addColorStop(1, big ? '#ff6a1a' : '#ffcf3a'); ctx.fillStyle = g; ctx.fillText(c.n + '-HIT COMBO', 0, 0);
    ctx.restore();
  }
  for (const t of Game.texts) {
    ctx.save(); ctx.globalAlpha = clamp(t.life / 20, 0, 1); ctx.font = (60 + (40 - Math.min(40, t.age * 4))).toFixed(0) + 'px Bangers, Impact, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 8; ctx.strokeStyle = '#120a08'; ctx.strokeText(t.s, t.x, t.y); ctx.fillStyle = t.c; ctx.fillText(t.s, t.x, t.y); ctx.restore();
  }
  // Touch-Steuerung
  ctx.globalAlpha = stick.active ? 0.85 : 0.4;
  ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 92, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fill(); ctx.strokeStyle = 'rgba(244,239,228,0.5)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(stick.x, stick.y, 42, 0, TAU); ctx.fillStyle = 'rgba(244,239,228,0.35)'; ctx.fill(); ctx.stroke();
  ctx.font = '600 22px Teko, sans-serif'; ctx.fillStyle = 'rgba(244,239,228,0.7)'; ctx.textAlign = 'center';
  if (!stick.active) ctx.fillText('↑ SPRUNG   ↓ DUCKEN   ← BLOCK', stick.ox, stick.oy + 120);
  ctx.globalAlpha = 1;
  for (const b of BUTTONS) {
    const ready = b.k !== 'SPEC' || Game.player.cd <= 0;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (b.down ? 0.92 : 1), 0, TAU);
    const g = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.35, 4, b.x, b.y, b.r);
    const col = b.k === 'SPEC' ? (Game.player.id === 'spider' ? ['#7aa2ff', '#1b3f9e'] : ['#ffd75a', '#a87806']) : b.k === 'HP' ? ['#ff8a5a', '#a3201a'] : b.k === 'K' ? ['#d0d0d0', '#4a4650'] : ['#ff6a6a', '#8c1018'];
    g.addColorStop(0, col[0]); g.addColorStop(1, col[1]); ctx.fillStyle = g; ctx.globalAlpha = ready ? (b.down ? 1 : 0.78) : 0.3; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#f4efe4'; ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffffff'; ctx.font = '700 40px Teko, sans-serif'; ctx.textBaseline = 'middle'; ctx.fillText(b.label, b.x, b.y - 4);
    ctx.font = '500 18px Teko, sans-serif'; ctx.fillText(b.sub, b.x, b.y + 24);
    if (b.k === 'SPEC' && !ready) { const k = Game.player.cd / Game.player.def.moves.SPEC.cd; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.arc(b.x, b.y, b.r, -Math.PI / 2, -Math.PI / 2 + TAU * k); ctx.closePath(); ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill(); }
  }
  // Pause-Knopf
  ctx.globalAlpha = 0.6; ctx.fillStyle = '#f4efe4'; ctx.fillRect(W / 2 - 13, 96, 8, 22); ctx.fillRect(W / 2 + 5, 96, 8, 22); ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------- Spielablauf
const Game = {
  screen: 'title', f: [], player: null, cam: STAGE / 2 - W / 2, timer: 99, round: 1, phase: 'intro', phaseT: 0,
  shakeAmp: 0, shakeT: 0, combos: [], texts: [], paused: false, pick: 'spider', titleT: 0, winner: null,
  other(f) { return this.f[0] === f ? this.f[1] : this.f[0]; },
  start(pick) {
    this.pick = pick; const cpuId = pick === 'spider' ? 'scorpion' : 'spider';
    this.f = [new Fighter(pick, 0, false), new Fighter(cpuId, 1, true)]; this.player = this.f[0];
    this.round = 1; this.screen = 'fight'; this.startRound();
    try { const de = document.documentElement; if (de.requestFullscreen) de.requestFullscreen().catch(() => { }); } catch (e) { }
  },
  startRound() {
    for (const F of this.f) F.reset(); projs.length = 0; parts.length = 0; decals.length = 0;
    this.timer = 99; this.phase = 'intro'; this.phaseT = 0; this.combos = []; this.texts = []; timeScale = 1;
    this.cam = STAGE / 2 - W / 2; Sfx.play('bell');
    this.say('Runde ' + this.round);
  },
  say(t) { Sfx.say(t); },
  shake(a, frames) { this.shakeAmp = Math.max(this.shakeAmp, a); this.shakeT = Math.max(this.shakeT, frames); },
  comboShow(att, n) { const side = this.f.indexOf(att); let c = this.combos.find((x) => x.side === side); if (!c) { c = { side, n, age: 0, life: 90 }; this.combos.push(c); } c.n = n; c.age = 0; c.life = 90; },
  popText(s, F, c) { this.texts.push({ s, x: F.x - this.cam, y: 260, c, age: 0, life: 50 }); },
  ko(att, def) {
    if (this.phase !== 'fight') return;
    this.phase = 'ko'; this.phaseT = 0; timeScale = 0.35; Sfx.play('ko'); this.shake(14, 12);
    att.wins++; this.winner = att; this.texts.push({ s: 'K.O.', x: W / 2, y: 300, c: '#ff3a2a', age: 0, life: 120 }); this.say('K.O.');
  },
  timeUp() {
    const [a, b] = this.f; const w = a.hp / a.def.hp >= b.hp / b.def.hp ? a : b;
    this.phase = 'ko'; this.phaseT = 0; w.wins++; this.winner = w; this.texts.push({ s: 'ZEIT!', x: W / 2, y: 300, c: '#ffcf3a', age: 0, life: 120 }); this.say('Zeit');
  },
  tap(p) {
    if (this.screen === 'title') {
      if (p.key) { this.start(this.pick); return; }
      if (p.y > 230 && p.y < 610) this.start(p.x < W / 2 ? 'spider' : 'scorpion');
    } else if (this.screen === 'end') {
      if (p.key || (p.y > 440 && p.y < 530 && p.x < W / 2)) this.start(this.pick);
      else if (p.y > 440 && p.y < 530) { this.screen = 'title'; }
    }
  },
  step() {
    frameNo++;
    pollInput();
    if (this.screen !== 'fight' || this.paused) { if (frameNo % 2 === 0) updateBgParts(); this.titleT++; return; }
    if (frameNo % 2 === 0) updateBgParts();
    const [a, b] = this.f;
    this.phaseT++;
    if (this.phase === 'intro') {
      if (this.phaseT === 70) { this.texts.push({ s: 'KÄMPFT!', x: W / 2, y: 300, c: '#ffcf3a', age: 0, life: 50 }); this.say('Kämpft!'); }
      if (this.phaseT > 100) this.phase = 'fight';
      for (const F of this.f) { F.animate(); F.solve(); }
    } else {
      if (this.phase === 'fight') { this.timer -= 1 / 60; if (this.timer <= 0) { this.timer = 0; this.timeUp(); } }
      // Zeitlupe nach K.O.: nur jeden n-ten Frame simulieren
      this.slowAcc = (this.slowAcc || 0) + timeScale;
      while (this.slowAcc >= 1) {
        this.slowAcc -= 1;
        a.update(b); b.update(a); updateProjs();
        // Körper schieben sich nicht ineinander
        const minD = 72 * (a.def.scale + b.def.scale) / 2, d = b.x - a.x;
        if (Math.abs(d) < minD && a.grounded && b.grounded && a.state !== 'pulled' && b.state !== 'pulled') { const push = (minD - Math.abs(d)) / 2 * Math.sign(d || 1); a.x -= push; b.x += push; }
        updateParts();
      }
      if (this.phase === 'ko') {
        if (this.phaseT > 70) timeScale = 1;
        if (this.phaseT === 110 && this.winner && this.winner.state !== 'ko') { this.winner.set('victory'); }
        if (this.phaseT > 210) {
          if (this.winner.wins >= 2) { this.screen = 'end'; this.say((this.winner.def.name === 'SPIDER-MAN' ? 'Spider-Man' : 'Scorpion') + ' gewinnt'); }
          else { this.round++; this.startRound(); }
        }
      }
    }
    // Kamera folgt der Mitte beider Kämpfer
    const mid = (a.x + b.x) / 2 - W / 2; this.cam = clamp(lerp(this.cam, mid, 0.12), 0, STAGE - W);
    for (const c of this.combos) { c.age++; c.life--; }
    this.combos = this.combos.filter((c) => c.life > 0 && !(c.n > 0 && this.f[1 - c.side].combo === 0 && c.age > 40));
    for (const t of this.texts) { t.age++; t.life--; }
    this.texts = this.texts.filter((t) => t.life > 0);
    if (this.shakeT > 0) this.shakeT--; else this.shakeAmp *= 0.7;
  },
  draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    const cam = this.cam;
    let sx = 0, sy = 0;
    if (this.shakeT > 0) { sx = rand(-1, 1) * this.shakeAmp; sy = rand(-1, 1) * this.shakeAmp * 0.6; }
    ctx.save(); ctx.translate(sx, sy);
    drawBackground(cam);
    if (this.screen === 'fight' || this.screen === 'end') {
      ctx.save(); ctx.translate(-cam, 0);
      const order = this.f.slice().sort((p, q) => (p.state === 'attack' ? 1 : 0) - (q.state === 'attack' ? 1 : 0));
      for (const F of order) drawFighter(F);
      drawProjs();
      ctx.restore();
      drawParts(cam);
    }
    ctx.restore();
    if (this.screen === 'title') this.drawTitle();
    else if (this.screen === 'fight') {
      drawHUD();
      if (this.phase === 'intro' && this.phaseT < 70) bigText('RUNDE ' + this.round, '#f4efe4', 1 + Math.max(0, 0.4 - this.phaseT * 0.02));
      if (this.paused) { ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H); bigText('PAUSE', '#f4efe4', 1); ctx.font = '600 30px Teko, sans-serif'; ctx.fillStyle = '#f4efe4'; ctx.textAlign = 'center'; ctx.fillText('Oben in der Mitte tippen zum Weiterspielen', W / 2, 420); }
    } else if (this.screen === 'end') this.drawEnd();
  },
  drawTitle() {
    const t = this.titleT;
    ctx.fillStyle = 'rgba(5,4,8,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '108px Bangers, Impact, sans-serif'; ctx.lineWidth = 12; ctx.strokeStyle = '#0b0608';
    const tl = 'SPIDER-MAN  VS.  SCORPION';
    ctx.strokeText(tl, W / 2, 110); const g = ctx.createLinearGradient(0, 60, 0, 160); g.addColorStop(0, '#fff3c4'); g.addColorStop(1, '#ff5a1a'); ctx.fillStyle = g; ctx.fillText(tl, W / 2, 110);
    ctx.font = '600 26px Teko, sans-serif'; ctx.fillStyle = 'rgba(244,239,228,0.75)'; ctx.fillText('Inoffizielles Fan-Spiel · nur privat · wähle deinen Kämpfer', W / 2, 182);
    // Auswahl-Karten mit Vorschau-Figuren
    for (const [id, cx] of [['spider', W * 0.3], ['scorpion', W * 0.7]]) {
      ctx.fillStyle = id === 'spider' ? 'rgba(27,63,158,0.35)' : 'rgba(232,180,25,0.25)'; ctx.strokeStyle = '#f4efe4'; ctx.lineWidth = 3;
      roundRect(cx - 200, 230, 400, 380, 18); ctx.fill(); ctx.stroke();
      const demo = this.demo || (this.demo = { spider: new Fighter('spider', 0, true), scorpion: new Fighter('scorpion', 1, true) });
      const F = demo[id]; F.x = cx + this.cam; F.y = 560; F.groundY = 560; F.facing = id === 'spider' ? 1 : -1; F.state = 'idle'; F.animate(); F.solve();
      ctx.save(); ctx.translate(-this.cam, 0); drawFighter(F); ctx.restore();
      ctx.font = '52px Bangers, Impact, sans-serif'; ctx.fillStyle = '#ffffff'; ctx.lineWidth = 7; ctx.strokeStyle = '#0b0608'; ctx.strokeText(F.def.name, cx, 590); ctx.fillText(F.def.name, cx, 590);
    }
    ctx.font = '600 24px Teko, sans-serif'; ctx.fillStyle = 'rgba(244,239,228,' + (0.6 + Math.sin(t * 0.08) * 0.3).toFixed(2) + ')';
    ctx.fillText('Spider-Man: schnell, Doppelsprung, 2× zurück = Ausweichen, Netz fesselt 0,8 s  ·  Scorpion: schwer, Speer zieht heran', W / 2, 650);
    ctx.fillText('Links wischen = bewegen/springen/ducken · zurück halten = blocken · LP → K → HP = Kombo', W / 2, 682);
  },
  drawEnd() {
    ctx.fillStyle = 'rgba(5,4,8,0.6)'; ctx.fillRect(0, 0, W, H);
    bigText(this.winner.def.name + ' GEWINNT', this.winner === this.player ? '#ffcf3a' : '#ff5a4a', 1, 300);
    ctx.font = '600 30px Teko, sans-serif'; ctx.fillStyle = '#f4efe4'; ctx.textAlign = 'center';
    ctx.fillText(this.winner === this.player ? 'Sieg! Runden ' + this.player.wins + ':' + this.other(this.player).wins : 'Niederlage. Runden ' + this.player.wins + ':' + this.other(this.player).wins, W / 2, 380);
    for (const [label, cx] of [['NOCHMAL', W / 2 - 170], ['KÄMPFER WÄHLEN', W / 2 + 170]]) {
      ctx.fillStyle = 'rgba(232,32,46,0.85)'; roundRect(cx - 150, 445, 300, 80, 14); ctx.fill(); ctx.strokeStyle = '#f4efe4'; ctx.lineWidth = 3; ctx.stroke();
      ctx.font = '700 40px Teko, sans-serif'; ctx.fillStyle = '#ffffff'; ctx.textBaseline = 'middle'; ctx.fillText(label, cx, 488);
    }
  },
};
function bigText(s, col, k, y = 320) {
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(k, k);
  ctx.font = '120px Bangers, Impact, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 14; ctx.strokeStyle = '#0b0608'; ctx.strokeText(s, 0, 0); ctx.fillStyle = col; ctx.fillText(s, 0, 0); ctx.restore();
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ---------------------------------------------------------------- Hauptschleife: feste 60-Hz-Schritte, Zeichnen pro Bildschirm-Frame
let last = performance.now(), acc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  acc += Math.min(250, now - last); last = now;
  let n = 0;
  while (acc >= STEP && n < 5) { Game.step(); acc -= STEP; n++; }
  if (n === 5) acc = 0;
  Game.draw();
}
document.addEventListener('visibilitychange', () => { if (document.hidden && Game.screen === 'fight') Game.paused = true; last = performance.now(); });
resize();
requestAnimationFrame(loop);
window.__fan = { Game, Input, CHARS };
</script>
